name: Generate Web Assets (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Generate protocol and embedded assets
        working-directory: web
        run: |
          bun run generate:proto
          bun run build

      - name: Commit generated files and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/generated web/dist
          git rm .github/workflows/generate-web-assets.yml
          if git diff --cached --quiet; then
            echo 'No generated changes found.'
            exit 0
          fi
          git commit -m 'Regenerate web protocol and bundles'
          git push origin HEAD:master
